services:
  web:
    build:
      context: .
      target: dev
      args:
        NODE_ENV: development

    volumes:
      - ./src:/opt/screamshotter/src
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=screamshotter.settings.dev
      - COLLECTSTATIC=0
      #- EXTERNAL_PUPPETEER=wss://chrome.paas.kasta.ovh:443

