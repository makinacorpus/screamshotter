# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test CI

on:
  pull_request:
  push:
    branches:
      - master
  release:
    types:
      - created
  schedule:
    - cron:  '0 15 * * *'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  flake8:
    name: Check python linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'  # lint with minimal version supported (3.10 in 22.04)

    - name: Install dependencies
      run: |
        python -m pip install flake8 -c requirements-dev.txt

    - name: Lint with flake8
      run: |
        flake8 src

  eslint:
    runs-on: ubuntu-latest
    name: Check javascript linting
    env:
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
    steps:
      - uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm ci
      - name: Lint with eslint
        run: |
          npm run lint
  test:
    name: Python Unittests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-22.04', 'ubuntu-24.04', 'ubuntu-26.04']

    steps:
    - uses: actions/checkout@v6

    - uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        python-version: 3.14
        enable-cache: true
        activate-environment: true

    - name: Install python dependencies
      run: |
        uv pip install -r requirements.txt -U
        uv pip install -r requirements-dev.txt

    - name: Setup nodejs
      uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: Install nodejs dependencies
      run: |
        npm ci

    - name: Test with coverage
      run: |
        cd src
        coverage run ./manage.py test
        coverage run -a ./manage.py test --settings screamshotter.settings.test_timeout screenshotter.tests.CaptureTestCase.test_timeout_screenshot

    - name: Coverage upload
      run: |
        pip install codecov
        cd src
        codecov

  build:
    name: Build ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [debian, docker]

    steps:
      - uses: actions/checkout@v6

      - name: Prepare debian versioning
        if: ${{ matrix.version != 'docker' }}
        run: |
          RAW_VER="$(cat src/screamshotter/VERSION | tr -d '[:space:]')"
          BASE_VER="$(echo "$RAW_VER" | sed -E 's/[-+]dev.*//; s/^v//')"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            PKG_VER="${BASE_VER}"
          else
            PKG_VER="${BASE_VER}~dev${GITHUB_RUN_ID}"
          fi
          sed -i "1s/screamshotter (\([^)]*\)) [^;]*;/screamshotter (${PKG_VER}) stable;/" debian/changelog

      - name: Build package
        if: ${{ matrix.version != 'docker' }}
        run: |
          VERSION="$(cat src/screamshotter/VERSION)" make build_deb
          cp ./dpkg/*.deb /home/runner/work/screamshotter/ 2>/dev/null || true
          cp ./dpkg/*.deb ./ 2>/dev/null || true

      - name: Archive package artifact
        if: ${{ matrix.version != 'docker' }}
        uses: actions/upload-artifact@v6
        with:
          name: debian-package
          path: |
            ./dpkg/*.deb

      - name: Set up Docker Buildx
        if: ${{ matrix.version == 'docker' }}
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: ${{ matrix.version == 'docker' }}
        run: |
          docker build -t screamshotter_ci:latest .

      - name: Upload image
        if: ${{ matrix.version == 'docker' }}
        uses: ishworkh/container-image-artifact-upload@v2.0.0
        with:
          image: "screamshotter_ci:latest"

  e2e:
    name: Tests E2E ${{ matrix.distro }}
    strategy:
      matrix:
        distro: [ resolute, noble, jammy, docker ]
        include:
          - distro: resolute
            version: '26.04'
          - distro: noble
            version: '24.04'
          - distro: jammy
            version: '22.04'
          - distro: docker
            version: latest

    runs-on: ubuntu-${{ matrix.version }}
    needs: [ build ]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        if: ${{ matrix.distro != 'docker' }}
        with:
          name: debian-package
          path: /home/runner/work/screamshotter/screamshotter/

      - name: Download image
        if: ${{ matrix.distro == 'docker' }}
        uses: ishworkh/container-image-artifact-download@v2.1.0
        with:
          image: "screamshotter_ci:latest"

      - name: Install package
        if: ${{ matrix.distro != 'docker' }}
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y /home/runner/work/screamshotter/screamshotter/*.deb

      - name: Run docker image (if required)
        if: ${{ matrix.distro == 'docker' }}
        run: |
          docker run -d -p 8000:8000 screamshotter_ci:latest

      - name: Wait for screamshotter service
        run: |
          echo "Waiting for service..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/ >/dev/null 2>&1 || wget -q -O- http://127.0.0.1:8000/ >/dev/null 2>&1; then
              echo "screamshotter service is ready!"
              exit 0
            fi
            sleep 1
          done
          echo "screamshotter service failed to start within 30s"
          if command -v systemctl >/dev/null 2>&1; then
            sudo journalctl -u screamshotter.service --no-pager 2>/dev/null || true
          fi
          exit 1

      - name: E2E test
        run: |
          curl -d url=https://example.com http://127.0.0.1:8000 > google.png

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check result
        run: |
          pip install filetype
          if filetype -f google.png | grep -q 'image/png'; then
            echo "File is PNG";
            exit 0;
          else
            echo "File is not PNG";
            filetype -f google.png;
            echo "=== Response body (first 50 lines) ===";
            head -n 50 google.png || true;
            if command -v systemctl >/dev/null 2>&1; then
              echo "=== journalctl screamshotter.service ===";
              sudo journalctl -u screamshotter.service -n 100 --no-pager || true;
            fi
            exit 1;
          fi

      - name: Archive result artifact
        uses: actions/upload-artifact@v6
        with:
          name: result-${{ matrix.distro }}
          path: |
            google.png

  deploy:
    name: Publish (on release only)
    runs-on: ubuntu-latest
    needs: [ flake8, eslint, test, e2e ]
    if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
    steps:
      - uses: actions/checkout@v6

      - name: Download debian artifact
        uses: actions/download-artifact@v7
        with:
          name: debian-package
          path: /home/runner/work/screamshotter/screamshotter/

      - name: Download docker image
        uses: ishworkh/container-image-artifact-download@v2.1.0
        with:
          image: "screamshotter_ci:latest"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            makinacorpus/screamshotter
            ghcr.io/makinacorpus/screamshotter
          tags: |
            type=raw,value=v2

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          push: true
          provenance: mode=max
          sbom: true
          builder: ${{ steps.buildx.outputs.name }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Publish debian packages
        run: |
          if [[ "${{ github.ref }}" == *"dev"* ]]; then
            export DEB_COMPONENT=dev
          else
            export DEB_COMPONENT=main
          fi
          echo "${{ github.ref }} : Publishing as $DEB_COMPONENT package"
          scp -P ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no /home/runner/work/screamshotter/screamshotter/screamshotter_*_amd64.deb ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/packages/incoming/$DEB_COMPONENT/
          if [[ "${{ github.ref }}" == *"dev"* ]]; then
            ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} make debian_dev -C /srv/packages
          else
            ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} make debian_main -C /srv/packages
          fi

      - name: Upload assets to release
        if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
        run: gh release upload "${{ github.ref_name }}" /home/runner/work/screamshotter/screamshotter/*.deb --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
